{% extends 'base.html' %}
{% block content %}
<div class="max-w-2xl mx-auto py-8">
    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-8">
        <div class="text-center mb-8">
            <h2 class="text-2xl font-bold text-dark-900">Report an Item</h2>
            <p class="text-slate-500 mt-2">Help reunite students with their belongings or report something you've lost.</p>
        </div>

        <form method="POST" enctype="multipart/form-data" class="space-y-6">
            {% csrf_token %}
            
            <!-- Type (Lost or Found) -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">Item Status</label>
                <div class="grid grid-cols-2 gap-4">
                    <label class="relative flex cursor-pointer">
                        <input type="radio" name="status" value="lost" class="peer sr-only" checked>
                        <div class="w-full text-center px-4 py-3 rounded-xl border border-slate-200 bg-white peer-checked:bg-rose-50 peer-checked:border-rose-500 peer-checked:text-rose-700 font-medium transition-colors">
                            Lost It
                        </div>
                    </label>
                    <label class="relative flex cursor-pointer">
                        <input type="radio" name="status" value="found" class="peer sr-only">
                        <div class="w-full text-center px-4 py-3 rounded-xl border border-slate-200 bg-white peer-checked:bg-emerald-50 peer-checked:border-emerald-500 peer-checked:text-emerald-700 font-medium transition-colors">
                            Found It
                        </div>
                    </label>
                </div>
            </div>

            <!-- Title -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Item Title</label>
                <input type="text" name="title" required placeholder="e.g. Blue Hydroflask, Lenovo Thinkpad" 
                       class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-colors">
            </div>

            <!-- Description -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Description & Location</label>
                <textarea name="description" required rows="4" placeholder="Describe the item, tell us where you saw or lost it, and any identifying marks..." 
                          class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-colors"></textarea>
            </div>

            <!-- Image Upload -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Photo (Optional but helpful)</label>
                <input type="file" name="image" accept="image/*" 
                       class="w-full text-sm text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-brand-50 file:text-brand-700 hover:file:bg-brand-100 transition-colors border border-slate-200 rounded-xl p-1 bg-white cursor-pointer">
            </div>

            <div class="pt-4 border-t border-slate-100 flex gap-4">
                <a href="{% url 'lostfound_list' %}" class="w-1/3 px-4 py-3 text-center rounded-xl text-slate-600 bg-slate-100 hover:bg-slate-200 font-medium transition-colors">
                    Cancel
                </a>
                <button type="submit" class="w-2/3 px-4 py-3 rounded-xl text-white bg-dark-900 hover:bg-brand-600 font-medium transition-colors shadow-md">
                    Submit Report
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
